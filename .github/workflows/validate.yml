name: Validate

on:
  pull_request:
  push:
    branches: ['codex/**']

permissions:
  contents: read

concurrency:
  group: sqh-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
